<!DOCTYPE html>
<head>
    <title>CSS animation</title>
    <style>
        /* Box 1 */
        .box {
            width: 100px;
            height: 100px;
            background: blue;
            transition: background 0.5s;
        }

        .box:hover {
            background: red;
        }

        /* Box 2 */
        @keyframes slide {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(100px);
            }
        }

        .box2 {
            width: 100px;
            height: 100px;
            background: teal;
            animation: slide 2s infinite ease;
        }

        /* Link */
        .link {
            position: relative;
            text-decoration: none;
        }

        .link::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: orange;
            transform: scaleX(0);  /* State A: invisible */
            transition: transform 0.3s ease-in-out;
        }

        .link:hover::after {
            transform: scaleX(1);
        }

        /* Live status */
        .dot {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            position: relative;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .dot::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }

        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 34px;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:checked + .slider::before {
            transform: translateX(26px);
        }
        
        /* Card */
        .card {
            width: 50px;
            height: 60px;
            background: #2196F3;
            margin-top: 20px;
            box-shadow: grey 8px 5px 3px;
            transition: transform 0.3s ease-in;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Spinning square */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(180deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .square {
            position: relative;
            width: 30px;
            height: 30px;
            background: #2196F3;
            margin: 20px 10px;
            animation: spin 2s infinite cubic-bezier(0, 0, 1, 1);
        }

        .square::after {
            content: '';
            top: 15px;
            left: 15px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: red;
            position: absolute;
        }

        /* Ghost button */
        .ghost-button {
            padding: 5px 10px;
            border: 1px transparent;
            background-color: transparent;
            transition: background-color 1s, color 1s, border 1s ease-in;
        }

        .ghost-button:hover {
            border: 1px solid grey;
            background-color: #2ecc71;
            color: white;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box2"></div>
    
    <a href="" class="link">Link</a>

    <div class="dot"></div>

    <label class="switch">
        <input type="checkbox">
        <span class="slider"></span>
    </label>

    <div class="card"></div>

    <div class="square"></div>

    <button class="ghost-button">Ghost button</button>
</body>
