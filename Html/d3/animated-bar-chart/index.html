<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="./style.css" />
    <title>Bar chart</title>
</head>
<body>
    <div id="wrapper">

        <div id="tooltip" class="tooltip">
            <div class="tooltip-x">
                x-value: <span id="tooltip-x-value">5</span> 
            </div>
            <div class="tooltip-y">
                y-value: <span id="tooltip-y-value">10</span>
            </div>
        </div>
    </div>

    <script src="../d3.min.js"></script>
    <script type="module" src="./chart.js"></script>
</body>
